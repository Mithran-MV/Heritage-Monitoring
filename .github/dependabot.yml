version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR per ecosystem rather than a dozen — easier to review and revert.
      react:
        patterns:
          [
            'react',
            'react-dom',
            '@types/react',
            '@types/react-dom',
            'next',
            'eslint-config-next',
          ]
      dev-tooling:
        patterns:
          ['eslint*', 'prettier*', 'vitest', '@vitest/*', 'typescript', '@types/*']
    ignore:
      # Both majors below are blocked by plugins bundled inside
      # eslint-config-next, not by anything in this repo. Lift each ignore once
      # eslint-config-next ships a release that depends on the newer version.
      #
      # typescript-eslint refuses to load under TS 7.0:
      #   "typescript-eslint does not support TS 7.0"
      # Tracking: https://github.com/typescript-eslint/typescript-eslint/issues/10940
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # eslint-plugin-react still calls context.getFilename(), removed in
      # ESLint 10, so `eslint .` dies before linting a single file:
      #   "TypeError: contextOrFilename.getFilename is not a function"
      - dependency-name: eslint
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
